x-service-healthcheck: &service-healthcheck
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 5s

services:
  postgres:
    image: library/postgres:13
    container_name: postgres
    restart: on-failure
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/:/docker-entrypoint-initdb.d/
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
      <<: *service-healthcheck

  payment-service:
    build: ./payment-service
    restart: on-failure
    environment:
      DATABASE_URL: postgres://program:test@postgres:5432/payments
    ports:
      - "8050:8050"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8050/manage/health"]
      <<: *service-healthcheck

  rental-service:
    build: ./rental-service
    restart: on-failure
    environment:
      DATABASE_URL: postgres://program:test@postgres:5432/rentals
    ports:
      - "8060:8060"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8060/manage/health"]
      <<: *service-healthcheck

  cars-service:
    build: ./cars-service
    restart: on-failure
    environment:
      DATABASE_URL: postgres://program:test@postgres:5432/cars
    ports:
      - "8070:8070"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8070/manage/health"]
      <<: *service-healthcheck

  gateway:
    build: ./gateway
    restart: on-failure
    environment:
      CARS_SERVICE_URL: http://cars-service:8070
      RENTAL_SERVICE_URL: http://rental-service:8060
      PAYMENT_SERVICE_URL: http://payment-service:8050
    ports:
      - "8080:8080"
    depends_on:
      cars-service:
        condition: service_healthy
      rental-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/manage/health"]
      <<: *service-healthcheck

  newman:
    image: postman/newman:alpine
    profiles: ["test"]
    volumes:
      - ./v3/postman:/etc/newman:ro
    command: >
      run collection.json
      -e environment.json
      --env-var baseUrl=http://gateway:8080
      --delay-request 100
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  db-data:
